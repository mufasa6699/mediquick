<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MediQuick</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>MediQuick</h1>
    <p>Online Pharmacy &amp; Medicine Delivery</p>
  </header>
  <main id="app">
    <section id="search">
      <h2>Search medicines</h2>
      <form id="search-form">
        <input id="search-input" type="search" placeholder="Medicine name or category, e.g. Panadol" autocomplete="off">
        <button type="submit">Search</button>
      </form>
      <p id="search-status" class="muted"></p>
      <ul id="results" class="results"></ul>
    </section>
    <section id="cart">
      <h2>Your cart</h2>
      <ul id="cart-items" class="results"></ul>
      <p id="cart-total" class="muted">Cart is empty</p>
      <form id="checkout-form">
        <label>Payment method
          <select id="payment-method">
            <option value="COD">Cash on Delivery</option>
            <option value="Card">Card</option>
          </select>
        </label>
        <button type="submit">Checkout</button>
      </form>
      <p id="checkout-status" class="muted"></p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
